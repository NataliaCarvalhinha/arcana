name: Deploy Arcana to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/youtube/catalog.json"
      - "data/youtube/playlists.json"
      - "scripts/sync-youtube.py"
      - ".github/workflows/sync-youtube.yml"
      - ".github/workflows/register-youtube-playlist.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
